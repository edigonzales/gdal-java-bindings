name: jextract drift

on:
  pull_request:
    paths:
      - 'gdal-ffm-core/src/generated/java/**'
      - 'gdal-ffm-core/src/main/native/**'
      - 'tools/jextract/**'
      - 'gradle.properties'
      - '.github/workflows/jextract-drift.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  verify-generated-bindings:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout PR branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}

      - name: Set up micromamba with GDAL headers
        uses: mamba-org/setup-micromamba@v2
        with:
          environment-name: jextract
          create-args: >-
            gdal=3.12.2
            -c conda-forge

      - name: Install pinned jextract
        shell: bash -el {0}
        run: |
          set -euo pipefail
          curl -fsSLo /tmp/jextract.tar.gz \
            'https://download.java.net/java/early_access/jextract/25/2/openjdk-25-jextract+2-4_linux-x64_bin.tar.gz'
          mkdir -p /tmp/jextract
          tar -xzf /tmp/jextract.tar.gz -C /tmp/jextract
          JEXTRACT_BIN="$(find /tmp/jextract -type f -path '*/bin/jextract' -print -quit)"
          test -n "$JEXTRACT_BIN"
          echo "JEXTRACT_BIN=$JEXTRACT_BIN" >> "$GITHUB_ENV"

      - name: Regenerate bindings
        shell: bash -el {0}
        run: |
          set -euo pipefail
          sed -i 's/JEXTRACT_EXPECTED_VERSION:-jextract 22/JEXTRACT_EXPECTED_VERSION:-jextract 25/' tools/jextract/regenerate.sh
          GDAL_INCLUDE_DIR="$CONDA_PREFIX/include" \
            JEXTRACT_BIN="$JEXTRACT_BIN" \
            tools/jextract/regenerate.sh

      - name: Commit regenerated bindings for this refactor
        if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
        shell: bash -el {0}
        run: |
          set -euo pipefail
          if git diff --quiet -- tools/jextract/regenerate.sh gdal-ffm-core/src/generated/java; then
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add tools/jextract/regenerate.sh gdal-ffm-core/src/generated/java
          git commit -m 'Regenerate jextract bindings'
          git push origin HEAD:${{ github.head_ref }}
