name: CI

on:
  push:
    branches: ["main", "codex/**"]
  pull_request:

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: linux-x86_64
            os: ubuntu-24.04
          - label: linux-aarch64
            os: ubuntu-24.04-arm
          - label: osx-x86_64
            os: macos-15-intel
          - label: osx-aarch64
            os: macos-15
          - label: windows-x86_64
            os: windows-2025
    name: ${{ matrix.label }}
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 23
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '23'

      - name: Make gradlew executable
        shell: bash
        run: chmod +x ./gradlew

      - name: Build and test
        shell: bash
        run: ./gradlew clean check :gdal-ffm-natives:check

      - name: Verify Runtime-Only Native Resources
        shell: bash
        run: |
          set -euo pipefail
          classifiers=(
            "linux-x86_64"
            "linux-aarch64"
            "osx-x86_64"
            "osx-aarch64"
            "windows-x86_64"
          )

          for classifier in "${classifiers[@]}"; do
            root="gdal-ffm-natives/src/main/resources/META-INF/gdal-native/$classifier"
            if [[ ! -d "$root" ]]; then
              continue
            fi

            if [[ "$classifier" == windows-* ]]; then
              if [[ -d "$root/bin" ]] && find "$root/bin" -type f ! -iname '*.dll' ! -name '.gitkeep' | grep -q .; then
                echo "Non-DLL files found in windows runtime bin for $classifier" >&2
                find "$root/bin" -type f ! -iname '*.dll' ! -name '.gitkeep' >&2
                exit 1
              fi
            else
              if [[ -d "$root/bin" ]] && find "$root/bin" -mindepth 1 -print -quit | grep -q .; then
                echo "Unexpected non-empty bin directory in runtime bundle for $classifier" >&2
                find "$root/bin" -mindepth 1 >&2
                exit 1
              fi
            fi
          done

  windows-native-smoke:
    name: windows-native-smoke
    runs-on: windows-2025
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 23
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '23'

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install conda-package-handling
        shell: bash
        run: |
          python -m pip install --user conda-package-handling
          USER_BASE="$(python -m site --user-base)"
          echo "$USER_BASE/Scripts" >> "$GITHUB_PATH"

      - name: Make scripts executable
        shell: bash
        run: chmod +x ./gradlew tools/natives/*.sh

      - name: Validate native lock file
        shell: bash
        run: tools/natives/verify-lock.sh

      - name: Stage Windows native payload
        shell: bash
        run: tools/natives/fetch-and-stage.sh windows-x86_64

      - name: Audit Windows runtime dependencies
        shell: bash
        run: tools/natives/audit-runtime-deps.sh windows-x86_64

      - name: Assemble Windows native jars
        shell: bash
        run: ./gradlew :gdal-ffm-natives:assemble

      - name: Run packaged Windows smoke
        shell: bash
        run: |
          set -euo pipefail
          matches=()
          while IFS= read -r path; do
            [[ -n "$path" ]] && matches+=("$path")
          done < <(
            find gdal-ffm-natives/build/libs -maxdepth 1 -type f \
              -name 'gdal-ffm-natives-*-natives-windows-x86_64.jar' \
              ! -name 'gdal-ffm-natives-swiss-*' \
              | sort
          )

          if [[ ${#matches[@]} -ne 1 ]]; then
            echo "Expected exactly one standard Windows native jar, found ${#matches[@]}" >&2
            printf '%s\n' "${matches[@]}" >&2 || true
            exit 1
          fi

          jar_path="$(pwd)/${matches[0]}"
          shared_tmpdir="$(pwd)/gdal-ffm-core/build/tmp/smoke/windows-x86_64-ci-shared"
          for run_label in first second; do
            ./gradlew :gdal-ffm-core:smokeTestPackagedNative \
              -PgdalFfmSmokeNativeJar="$jar_path" \
              -PgdalFfmSmokeLabel="windows-x86_64-ci-${run_label}" \
              -PgdalFfmSmokeTmpDir="$shared_tmpdir"
          done

      - name: Dump Windows dependency diagnostics on failure
        if: failure()
        shell: bash
        run: |
          set +e
          echo "=== Windows native smoke diagnostics ==="
          dump_tool=""
          if command -v dumpbin >/dev/null 2>&1; then
            dump_tool="dumpbin"
          elif command -v llvm-objdump >/dev/null 2>&1; then
            dump_tool="llvm-objdump"
          fi

          tmpdir="$(pwd)/gdal-ffm-core/build/tmp/smoke/windows-x86_64-ci-shared"
          echo "--- extracted tree under ${tmpdir}"
          find "$tmpdir" -maxdepth 6 -print 2>/dev/null || true

          while IFS= read -r dll_path; do
            [[ -n "$dll_path" ]] || continue
            echo "--- dependency dump for ${dll_path}"
            if [[ "$dump_tool" == "dumpbin" ]]; then
              dumpbin /DEPENDENTS "$dll_path" || true
            elif [[ "$dump_tool" == "llvm-objdump" ]]; then
              llvm-objdump -p "$dll_path" || true
            else
              echo "No dump tool available"
            fi
          done < <(
            find "$tmpdir" \
              \( -path '*/windows-x86_64/bin/proj_9.dll' -o -path '*/windows-x86_64/bin/gdal.dll' \) \
              -type f 2>/dev/null | sort -u
          )
